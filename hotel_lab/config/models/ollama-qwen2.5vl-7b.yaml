# Open-weight model served locally by Ollama (native API, so we can set the context window).
# First run:  ollama pull qwen2.5vl:7b
provider: ollama
base_url: http://localhost:11434
model: "qwen2.5vl:7b"
family: qwen
size_b: 7
quantisation: Q4_K_M        # Ollama default; check with: ollama show qwen2.5vl:7b
serving: ollama
temperature: 1.0            # main runs; copy this file with 0.0 for the robustness check
max_tokens: 400             # use 1000+ with reasoning_depth: high
num_ctx: 16384              # full-review prompts are ~5k tokens; Ollama's default (2-4k) would cut them
supports_vision: true
json_mode: false            # set true if the model often breaks the JSON format
send_seed: true
