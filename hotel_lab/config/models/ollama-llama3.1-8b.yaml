# Open-weight model served locally by Ollama.  First run:  ollama pull llama3.1:8b
provider: openai_compatible
base_url: http://localhost:11434/v1
model: "llama3.1:8b"
family: llama
size_b: 8
quantisation: Q4_K_M        # Ollama default; check with: ollama show llama3.1:8b
serving: ollama
temperature: 1.0
max_tokens: 400
supports_vision: false
json_mode: false            # set true if the model often breaks the JSON format
send_seed: true
