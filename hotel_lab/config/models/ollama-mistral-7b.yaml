# Open-weight model served locally by Ollama.  First run:  ollama pull mistral:7b
provider: openai_compatible
base_url: http://localhost:11434/v1
model: "mistral:7b"
family: mistral
size_b: 7
quantisation: Q4_K_M        # Ollama default; check with: ollama show mistral:7b
serving: ollama
temperature: 1.0
max_tokens: 400
supports_vision: false
json_mode: false            # set true if the model often breaks the JSON format
send_seed: true
