# Open-weight model through the Hugging Face inference router. Needs HF_TOKEN in your .env file.
provider: openai_compatible
base_url: https://router.huggingface.co/v1
api_key_env: HF_TOKEN
model: Qwen/Qwen2.5-72B-Instruct
family: qwen
size_b: 72
quantisation: provider-default
serving: hf
temperature: 1.0
max_tokens: 400
supports_vision: false
json_mode: false
send_seed: true
