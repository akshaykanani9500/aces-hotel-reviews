<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StayCompare{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">StayCompare</span>
    {% if view %}
    <div class="searchsum">
      <span><b>Stay:</b> {{ view.title }}</span>
      <span><b>Check-in:</b> {{ view.check_in }}</span>
      <span><b>Nights:</b> {{ view.nights }}</span>
      <span><b>Guests:</b> 2 adults</span>
    </div>
    {% endif %}
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
